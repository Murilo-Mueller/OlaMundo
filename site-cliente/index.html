<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro site</title>
</head>
<body>
    <div style="background-color: #ffffff; max-width: 450px; width: 90%; padding: 32px; border-radius: 12px; box-shadow: 0 1px 3px rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15); text-align: center;">
        
        <!-- Barra de Detalhe Minimalista (Paleta Google) -->
        <div style="display: flex; justify-content: center; margin-bottom: 24px; gap: 4px;">
            <div style="width: 12px; height: 4px; background-color: #1a73e8; border-radius: 2px;"></div>
            <div style="width: 12px; height: 4px; background-color: #ea4335; border-radius: 2px;"></div>
            <div style="width: 12px; height: 4px; background-color: #fbbc05; border-radius: 2px;"></div>
            <div style="width: 12px; height: 4px; background-color: #34a853; border-radius: 2px;"></div>
        </div>

        <!-- Nome -->
        <h1 style="font-size: 24px; font-weight: 600; margin: 0 0 8px 0; color: #1a73e8; letter-spacing: -0.5px;">
            Murilo Rückert Mueller
        </h1>

        <!-- Idade e Localização -->
        <p style="font-size: 14px; color: #5f6368; margin: 0 0 24px 0; font-weight: 500;">
            16 anos &bull; Jaraguá do Sul, SC
        </p>

        <!-- Linha Divisória Sutil -->
        <hr style="border: 0; height: 1px; background-color: #e8eaed; margin-bottom: 24px;">

        <!-- Detalhes da Formação -->
        <div style="text-align: left; background-color: #f8f9fa; padding: 16px; border-radius: 8px; border-left: 4px solid #1a73e8;">
            <span style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #5f6368; font-weight: 700; display: block; margin-bottom: 4px;">
                Instituição
            </span>
            <p style="font-size: 16px; font-weight: 600; margin: 0 0 12px 0; color: #202124;">
                CentroWEG
            </p>

            <span style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #5f6368; font-weight: 700; display: block; margin-bottom: 4px;">
                Curso
            </span>
            <p style="font-size: 15px; margin: 0; color: #3c4043; line-height: 1.4;">
                Técnico em Cibersistemas para Automação
            </p>
        </div>

    </div>
</body>
</html>
